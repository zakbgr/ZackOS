# ZackOS base Kitty config. If you already have a kitty.conf, ZackOS never replaces it:
# add the next line to yours to get the theme.
include zackos-theme.conf

enable_audio_bell    no
confirm_os_window_close 0
scrollback_lines     10000
copy_on_select       clipboard
window_padding_width 8
hide_window_decorations no
