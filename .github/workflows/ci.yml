name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all checks (generated files in sync, unit tests, shell tests, shellcheck)
        run: bash tests/run.sh
